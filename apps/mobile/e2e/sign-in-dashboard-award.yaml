appId: com.housepoints.app
name: Sign in, load dashboard, and award points
tags:
  - staging
  - smoke
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "mobile.login.sign-in"
    timeout: 30000
- tapOn:
    id: "mobile.login.sign-in"

- tapOn:
    text: "Use without an account"
    optional: true
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Email address.*"
    timeout: 30000
- tapOn: "Email address.*"
- inputText: ${MOBILE_E2E_USER_EMAIL}
- tapOn: "Password.*"
- inputText: ${MOBILE_E2E_USER_PASSWORD}
- hideKeyboard
- tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "mobile.home.dashboard"
    timeout: 60000
- assertVisible:
    id: "mobile.home.award-points"
- tapOn:
    id: "mobile.home.award-points"

- extendedWaitUntil:
    visible:
      id: "mobile.award.member-select"
    timeout: 30000
- tapOn:
    id: "mobile.award.member-select"
- tapOn: ${MOBILE_E2E_TARGET_MEMBER}
- assertVisible:
    id: "mobile.award.trait-select"
- tapOn:
    id: "mobile.award.trait-select"
- extendedWaitUntil:
    visible:
      id: "mobile.award.trait.*"
    timeout: 10000
- tapOn:
    id: "mobile.award.trait.*"
    index: 0
- tapOn:
    id: "mobile.award.points"
- eraseText
- inputText: "101"
- assertVisible: "Enter a whole number from 1 to 100."
- eraseText
- inputText: "100"
- assertVisible: "Award 100 points"
# Exercise a custom amount while keeping staging awards small.
- eraseText
- inputText: "7"
- assertVisible: "Award 7 points"
- hideKeyboard
- tapOn:
    id: "mobile.award.reason"
- inputText: "Maestro staging award"
# Keep the keyboard open: both the reason and submit action must stay reachable.
- assertVisible:
    id: "mobile.award.reason"
- assertVisible: "Maestro staging award"
- extendedWaitUntil:
    visible:
      id: "mobile.award.submit"
    timeout: 10000
- tapOn:
    id: "mobile.award.submit"

- extendedWaitUntil:
    visible:
      id: "mobile.home.dashboard"
    timeout: 30000
- assertVisible:
    id: "mobile.home.award-points"
- tapOn:
    id: "mobile.nav.activity"
- extendedWaitUntil:
    visible:
      id: "mobile.activity.attribution.*"
    timeout: 30000
- tapOn:
    id: "mobile.nav.leaderboard"
- extendedWaitUntil:
    visible: "Top Contributors"
    timeout: 30000
- assertVisible:
    id: "mobile.header.account"
- tapOn:
    id: "mobile.header.account"
- extendedWaitUntil:
    visible:
      id: "mobile.profile.organization-select"
    timeout: 10000
- assertVisible:
    id: "mobile.profile.notification-status"
