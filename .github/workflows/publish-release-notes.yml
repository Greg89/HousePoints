name: Publish Release Notes

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish static release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify release notes site
        run: |
          test -d site || (echo "site/ directory is missing" && exit 1)
          test -f site/index.html || (echo "site/index.html is missing" && exit 1)
          test -f site/releases/index.html || (echo "site/releases/index.html is missing" && exit 1)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload release notes site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
