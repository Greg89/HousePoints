name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional staging base URL override"
        required: false
        type: string
  schedule:
    - cron: "17 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_REACTION_ACTOR_EMAIL: ${{ secrets.E2E_REACTION_ACTOR_EMAIL }}
      E2E_REACTION_ACTOR_PASSWORD: ${{ secrets.E2E_REACTION_ACTOR_PASSWORD }}
      E2E_REACTION_RECIPIENT_EMAIL: ${{ secrets.E2E_REACTION_RECIPIENT_EMAIL }}
      E2E_REACTION_RECIPIENT_PASSWORD: ${{ secrets.E2E_REACTION_RECIPIENT_PASSWORD }}
      E2E_TARGET_MEMBER: ${{ secrets.E2E_TARGET_MEMBER }}
      E2E_ORG_SLUG: ${{ secrets.E2E_ORG_SLUG }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate E2E configuration
        shell: bash
        run: |
          missing=()
          for name in E2E_BASE_URL E2E_USER_EMAIL E2E_USER_PASSWORD E2E_TARGET_MEMBER E2E_ORG_SLUG; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required E2E configuration: ${missing[*]}"
            exit 1
          fi

          node - <<'NODE'
          const rawBaseUrl = process.env.E2E_BASE_URL?.trim();
          let baseUrl;
          try {
            baseUrl = new URL(rawBaseUrl);
          } catch {
            console.error("E2E_BASE_URL must be an absolute URL, for example https://housepointsweb-beta.up.railway.app");
            process.exit(1);
          }

          if (baseUrl.protocol !== "http:" && baseUrl.protocol !== "https:") {
            console.error("E2E_BASE_URL must use the http or https protocol.");
            process.exit(1);
          }

          const rawOrgSlug = process.env.E2E_ORG_SLUG?.trim();
          const startPath = rawOrgSlug ? `/o/${encodeURIComponent(rawOrgSlug)}` : "/";
          const targetUrl = new URL(startPath, baseUrl);
          const adminConfigured = Boolean(process.env.E2E_ADMIN_EMAIL?.trim() && process.env.E2E_ADMIN_PASSWORD?.trim());
          const ownerConfigured = Boolean(process.env.E2E_OWNER_EMAIL?.trim() && process.env.E2E_OWNER_PASSWORD?.trim());
          const reactionActorConfigured = Boolean(process.env.E2E_REACTION_ACTOR_EMAIL?.trim() && process.env.E2E_REACTION_ACTOR_PASSWORD?.trim());
          const reactionRecipientConfigured = Boolean(process.env.E2E_REACTION_RECIPIENT_EMAIL?.trim() && process.env.E2E_REACTION_RECIPIENT_PASSWORD?.trim());
          console.log(`E2E base protocol: ${baseUrl.protocol}`);
          console.log(`E2E base host: ${baseUrl.host}`);
          console.log(`E2E base pathname: ${baseUrl.pathname}`);
          console.log(`E2E org slug configured: ${rawOrgSlug ? "yes" : "no"}`);
          console.log(`E2E admin actor configured: ${adminConfigured ? "yes" : "no"}`);
          console.log(`E2E owner actor configured: ${ownerConfigured ? "yes" : "no"}`);
          console.log(`E2E reaction actor configured: ${reactionActorConfigured ? "yes" : "no"}`);
          console.log(`E2E reaction recipient configured: ${reactionRecipientConfigured ? "yes" : "no"}`);
          console.log(`E2E start pathname: ${targetUrl.pathname}`);
          console.log(`E2E start host: ${targetUrl.host}`);
          NODE

      - name: Probe staging target
        shell: bash
        run: |
          node - <<'NODE'
          const baseUrl = new URL(process.env.E2E_BASE_URL.trim());
          const rawOrgSlug = process.env.E2E_ORG_SLUG?.trim();
          const startPath = rawOrgSlug ? `/o/${encodeURIComponent(rawOrgSlug)}` : "/";
          const targetUrl = new URL(startPath, baseUrl);

          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 30000);

          try {
            const response = await fetch(targetUrl, {
              method: "GET",
              redirect: "manual",
              signal: controller.signal,
            });
            console.log(`E2E target probe host: ${targetUrl.host}`);
            console.log(`E2E target probe pathname: ${targetUrl.pathname}`);
            console.log(`E2E target probe status: ${response.status}`);
            console.log(`E2E target probe location: ${response.headers.get("location") ?? "(none)"}`);
          } catch (error) {
            console.error(`E2E target probe failed: ${error instanceof Error ? error.message : String(error)}`);
            process.exit(1);
          } finally {
            clearTimeout(timeout);
          }
          NODE

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staging E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
