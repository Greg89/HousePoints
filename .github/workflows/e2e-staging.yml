name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional staging base URL override"
        required: false
        type: string
  schedule:
    - cron: "17 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_TARGET_MEMBER: ${{ secrets.E2E_TARGET_MEMBER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate E2E configuration
        shell: bash
        run: |
          missing=()
          for name in E2E_BASE_URL E2E_USER_EMAIL E2E_USER_PASSWORD E2E_TARGET_MEMBER; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required E2E configuration: ${missing[*]}"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staging E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 14
