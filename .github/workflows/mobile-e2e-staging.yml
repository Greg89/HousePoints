name: Mobile Staging E2E

on:
  workflow_dispatch:
    inputs:
      android_app_url:
        description: "Optional staging APK URL override"
        required: false
        type: string
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: mobile-staging-e2e
  cancel-in-progress: false

jobs:
  maestro:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging

    env:
      MOBILE_E2E_ANDROID_APP_URL: ${{ inputs.android_app_url || secrets.MOBILE_E2E_ANDROID_APP_URL }}
      MOBILE_E2E_USER_EMAIL: ${{ secrets.MOBILE_E2E_USER_EMAIL }}
      MOBILE_E2E_USER_PASSWORD: ${{ secrets.MOBILE_E2E_USER_PASSWORD }}
      MOBILE_E2E_TARGET_MEMBER: ${{ secrets.MOBILE_E2E_TARGET_MEMBER }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate mobile E2E configuration
        shell: bash
        run: |
          missing=()
          for name in MOBILE_E2E_ANDROID_APP_URL MOBILE_E2E_USER_EMAIL MOBILE_E2E_USER_PASSWORD MOBILE_E2E_TARGET_MEMBER; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required mobile E2E configuration: ${missing[*]}"
            exit 1
          fi

          node - <<'NODE'
          const appUrl = new URL(process.env.MOBILE_E2E_ANDROID_APP_URL);
          if (appUrl.protocol !== "https:") {
            console.error("MOBILE_E2E_ANDROID_APP_URL must use HTTPS.");
            process.exit(1);
          }
          console.log(`Mobile E2E APK host: ${appUrl.host}`);
          console.log(`Mobile E2E target member configured: ${process.env.MOBILE_E2E_TARGET_MEMBER.trim() ? "yes" : "no"}`);
          NODE

      - name: Download staging Android app
        shell: bash
        run: |
          curl --fail-with-body --location --show-error --silent \
            "$MOBILE_E2E_ANDROID_APP_URL" \
            --output housepoints-staging.apk
          test -s housepoints-staging.apk

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION=2.7.0
          curl --fail-with-body --location --show-error --silent \
            https://get.maestro.mobile.dev \
            | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro staging flow
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r housepoints-staging.apk
            maestro --version
            maestro test \
              -e "MOBILE_E2E_USER_EMAIL=$MOBILE_E2E_USER_EMAIL" \
              -e "MOBILE_E2E_USER_PASSWORD=$MOBILE_E2E_USER_PASSWORD" \
              -e "MOBILE_E2E_TARGET_MEMBER=$MOBILE_E2E_TARGET_MEMBER" \
              apps/mobile/e2e/sign-in-dashboard-award.yaml

      - name: Upload Maestro failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-staging-maestro-failure
          path: ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Write Maestro run summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Mobile staging E2E"
            echo
            echo "- Runner: GitHub-hosted Android emulator"
            echo "- Maestro: free CLI 2.7.0"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
